const palette = [
  "#5b8ff9","#61ddaa","#f6bd16","#7262fd","#78d3f8",
  "#9661bc","#f6903d","#008685","#f08bb4","#e8684a",
  "#26ceb0","#ff9eb3","#a0a7e6","#c4ebad","#f8b551",
  "#bebac9","#5cd6a9","#dc8dff","#7a9bff","#e2a63a"
];

function colorFor(community) {
  if (community === -1 || community === undefined) return "#5c6270";
  return palette[community % palette.length];
}

// Structural noise (contains/imports) gets a dim, thin line; semantic
// relations (inherits/extends/uses/...) get a distinct, brighter color
// so the graph reads as "what depends on what" rather than a hairball.
const relationStyle = {
  contains:      { color: "#3a4150", width: 0.35 },
  imports:       { color: "#4fc3f7", width: 0.8  },
  imports_from:  { color: "#29b6f6", width: 0.8  },
  references:    { color: "#ffca28", width: 1.0  },
  uses:          { color: "#66bb6a", width: 1.3  },
  inherits:      { color: "#ef5350", width: 1.8  },
  extends:       { color: "#ff7043", width: 1.8  },
  re_exports:    { color: "#ab47bc", width: 1.2  },
  rationale_for: { color: "#8d6e63", width: 1.2  },
};
const defaultRelationStyle = { color: "rgba(255,255,255,0.25)", width: 0.6 };

function styleFor(relation) {
  return relationStyle[relation] || defaultRelationStyle;
}

const legendEl = document.getElementById("legend");
Object.entries(DATA.labels).slice(0, 12).forEach(([idx, name]) => {
  const row = document.createElement("div");
  const sw = document.createElement("span");
  sw.className = "sw";
  sw.style.background = colorFor(parseInt(idx, 10));
  row.appendChild(sw);
  const label = document.createElement("span");
  label.textContent = name;
  row.appendChild(label);
  legendEl.appendChild(row);
});

const edgeLegendEl = document.getElementById("edge-legend");
const relationCounts = {};
DATA.links.forEach(l => { relationCounts[l.relation] = (relationCounts[l.relation] || 0) + 1; });
Object.keys(relationStyle)
  .filter(rel => relationCounts[rel])
  .sort((a, b) => relationCounts[b] - relationCounts[a])
  .forEach(rel => {
    const row = document.createElement("div");
    const sw = document.createElement("span");
    sw.className = "sw line";
    sw.style.background = relationStyle[rel].color;
    row.appendChild(sw);
    const label = document.createElement("span");
    label.textContent = `${rel} (${relationCounts[rel]})`;
    row.appendChild(label);
    edgeLegendEl.appendChild(row);
  });

const infoEl = document.getElementById("info");

const Graph = ForceGraph3D()(document.getElementById("graph"))
  .graphData(DATA)
  .backgroundColor("#0b0d12")
  .nodeId("id")
  .nodeLabel(n => `${n.label} (${n.community_name})`)
  .nodeColor(n => colorFor(n.community))
  .nodeVal(n => n.val)
  .nodeOpacity(0.95)
  .linkLabel(l => `${l.source.label || l.source} &rarr; ${l.target.label || l.target}<br><b>${l.relation}</b> (${l.confidence.toLowerCase()})`)
  .linkColor(l => styleFor(l.relation).color)
  .linkWidth(l => styleFor(l.relation).width * (l.confidence === "INFERRED" ? 1.4 : 1))
  .linkOpacity(0.55)
  .linkDirectionalParticles(l => l.confidence === "INFERRED" ? 2 : 0)
  .linkDirectionalParticleWidth(1.6)
  .linkDirectionalParticleColor(l => styleFor(l.relation).color)
  .linkDirectionalArrowLength(l => ["inherits", "extends"].includes(l.relation) ? 4 : 2)
  .linkDirectionalArrowRelPos(1)
  .linkDirectionalArrowColor(l => styleFor(l.relation).color)
  .onNodeClick(n => {
    infoEl.style.display = "block";
    infoEl.innerHTML = `<b>${n.label}</b><br>${n.community_name}<br><span style="color:#9aa0ab">${n.file || ""}</span><br>connections: ${n.val}`;
    const distance = 120;
    const distRatio = 1 + distance / Math.hypot(n.x, n.y, n.z);
    Graph.cameraPosition(
      { x: n.x * distRatio, y: n.y * distRatio, z: n.z * distRatio },
      n,
      800
    );
  })
  .onBackgroundClick(() => { infoEl.style.display = "none"; });

Graph.d3Force("charge").strength(-90);
